<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Batch Sender</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #7c65c1; /* Farcaster Purple */
            --text: #f8fafc;
            --border: #334155;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 { text-align: center; color: var(--accent); margin-top: 0; }
        
        .profile-badge {
            display: none; /* Hidden by default */
            background: #00000044;
            padding: 10px;
            border-radius: 8px;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .profile-badge img { width: 32px; height: 32px; border-radius: 50%; }
        
        textarea {
            width: 100%;
            height: 120px;
            background: #0f172a;
            border: 1px solid var(--border);
            color: #38bdf8;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            font-family: monospace;
            resize: none;
            font-size: 13px;
        }
        
        .btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
        }
        .btn:disabled { background: #475569; cursor: not-allowed; }

        .log {
            margin-top: 15px;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Base Batch Sender</h2>

    <div id="userProfile" class="profile-badge">
        <img id="pfp" src="" alt="pfp">
        <div>
            <div id="username" style="font-weight:bold">@loading...</div>
            <div id="fid" style="font-size:11px; color:#94a3b8">FID: ...</div>
        </div>
    </div>

    <div id="app-content" style="display:none;">
        <p style="font-size:12px; color:#94a3b8; margin-bottom:8px">Recipients (Address, Amount ETH)</p>
        <textarea id="csvInput" placeholder="0x123..., 0.001&#10;0x456..., 0.005"></textarea>
        
        <button id="sendBtn" class="btn">Send Batch (1-Click)</button>
        <div id="status" class="log">Enter addresses to start</div>
    </div>

    <button id="connectBtn" class="btn" style="display:none;">Connect Wallet</button>
</div>

<script type="module">
    try {
        const { sdk } = await import('https://esm.sh/@farcaster/miniapp-sdk');
        window.sdk = sdk;
        await sdk.actions.ready({ disableNativeGestures: true });
        console.log('✅ Farcaster SDK initialized');
        
        // Trigger UI Init after SDK is ready
        window.dispatchEvent(new Event('sdk-ready'));
    } catch (error) {
        console.error('❌ Farcaster SDK failed:', error);
    }
</script>

<script>
    let fcProvider;

    // Wait for SDK to load
    window.addEventListener('sdk-ready', async () => {
        const status = document.getElementById('status');
        
        // 1. Load User Context
        try {
            const context = await window.sdk.context;
            if (context && context.user) {
                document.getElementById('userProfile').style.display = 'flex';
                document.getElementById('username').innerText = `@${context.user.username}`;
                document.getElementById('fid').innerText = `FID: ${context.user.fid}`;
                document.getElementById('pfp').src = context.user.pfpUrl;
            }
        } catch (e) {
            console.error("Context error:", e);
        }

        // 2. Initialize Wallet Provider from SDK (Fixes your connection issue)
        // We do NOT use window.ethereum. We use the SDK provider.
        fcProvider = window.sdk.wallet.getEthereumProvider();

        // Check if already connected
        try {
            const accounts = await fcProvider.request({ method: 'eth_accounts' });
            if (accounts.length > 0) {
                enableApp();
            } else {
                document.getElementById('connectBtn').style.display = 'block';
            }
        } catch (e) {
            status.innerText = "Error loading wallet info";
        }
    });

    // Connect Button Logic
    document.getElementById('connectBtn').onclick = async () => {
        try {
            await fcProvider.request({ method: 'eth_requestAccounts' });
            enableApp();
        } catch (e) {
            document.getElementById('status').innerText = "Connection failed";
        }
    };

    function enableApp() {
        document.getElementById('connectBtn').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        document.getElementById('status').innerText = "Wallet Connected ✅";
    }

    // --- BATCH SEND LOGIC (EIP-5792) ---
    document.getElementById('sendBtn').onclick = async () => {
        const btn = document.getElementById('sendBtn');
        const status = document.getElementById('status');
        const input = document.getElementById('csvInput').value;

        // Parse Input
        const lines = input.split('\n');
        const calls = [];

        for (let line of lines) {
            const [addr, amt] = line.split(',');
            if (addr && amt) {
                try {
                    calls.push({
                        to: addr.trim(),
                        value: ethers.utils.parseEther(amt.trim()).toHexString(), // Must be Hex
                        data: "0x" // Empty data for ETH transfer
                    });
                } catch (e) {
                    return alert("Invalid amount or address in line: " + line);
                }
            }
        }

        if (calls.length === 0) return alert("No recipients found!");

        // Execute Batch Transaction
        try {
            btn.disabled = true;
            btn.innerText = "Requesting Signature...";
            
            // This is the new Farcaster feature (Batch Transactions)
            const txHash = await fcProvider.request({
                method: 'wallet_sendCalls',
                params: [{
                    version: '1.0',
                    chainId: '0x2105', // Base Mainnet (8453) in Hex
                    calls: calls
                }]
            });

            status.innerHTML = `<span style="color:#4ade80">Success! Batch ID sent.</span>`;
            btn.innerText = "Sent!";
            
            // Reset after 3s
            setTimeout(() => { btn.disabled = false; btn.innerText = "Send Batch (1-Click)"; }, 3000);

        } catch (error) {
            console.error(error);
            status.innerText = "Error: " + (error.message || "User rejected");
            btn.disabled = false;
            btn.innerText = "Send Batch (1-Click)";
        }
    };
</script>

</body>
</html>
