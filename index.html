<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Simple Multi-Sender</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 50px; }
        .card { width: 450px; background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; background: #334155; border: 1px solid #475569; color: white; padding: 12px; border-radius: 8px; font-family: monospace; resize: none; box-sizing: border-box; }
        .btn { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; font-size: 16px; }
        .btn:hover { background: #0369a1; }
        .log { margin-top: 20px; font-size: 13px; max-height: 150px; overflow-y: auto; color: #94a3b8; }
        .status-success { color: #4ade80; }
        .status-pending { color: #fbbf24; }
    </style>
</head>
<body>

<div class="card">
    <h2>Multi-Sender (No Contract)</h2>
    <button id="connectBtn" class="btn">Connect Wallet</button>

    <div id="ui" style="display:none; margin-top:20px;">
        <label style="font-size: 12px; color: #94a3b8;">Enter Recipient, Amount (One per line)</label>
        <textarea id="list" placeholder="0x123..., 0.01&#10;0x456..., 0.02"></textarea>
        
        <button id="sendBtn" class="btn">Send Transactions</button>
        
        <div id="log" class="log"></div>
    </div>
</div>

<script>
    let provider, signer, address;

    async function connect() {
        if (!window.ethereum) return alert("Please install MetaMask");
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        address = await signer.getAddress();
        
        document.getElementById('connectBtn').innerText = "Connected: " + address.substring(0,6) + "...";
        document.getElementById('ui').style.display = 'block';
    }

    async function sendMulti() {
        const lines = document.getElementById('list').value.split('\n');
        const logDiv = document.getElementById('log');
        logDiv.innerHTML = "Starting process...";

        // 1. Get current Nonce (important for sequence)
        let currentNonce = await provider.getTransactionCount(address, "pending");

        for (let line of lines) {
            const [to, amt] = line.split(',');
            if (!to || !amt) continue;

            try {
                const txRequest = {
                    to: to.trim(),
                    value: ethers.utils.parseEther(amt.trim()),
                    nonce: currentNonce // Manual nonce ensures they don't overwrite each other
                };

                logDiv.innerHTML += `<div class="status-pending">Requesting ${amt} ETH to ${to.substring(0,6)}...</div>`;
                
                // Send transaction
                const tx = await signer.sendTransaction(txRequest);
                
                logDiv.innerHTML += `<div class="status-success">Sent! Hash: ${tx.hash.substring(0,10)}...</div>`;
                
                // Increment nonce for the next transaction in the loop
                currentNonce++; 

            } catch (err) {
                logDiv.innerHTML += `<div style="color:#f87171">Error: ${err.message.substring(0,50)}...</div>`;
                break; // Stop loop if user rejects or error occurs
            }
        }
    }

    document.getElementById('connectBtn').addEventListener('click', connect);
    document.getElementById('sendBtn').addEventListener('click', sendMulti);
</script>

</body>
</html>
