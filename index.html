<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Multi-Send Pro</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js" type="application/javascript"></script>
    <style>
        :root { --base: #0052FF; --dark: #0f172a; --card: #1e293b; }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: white; display: flex; justify-content: center; padding: 40px; margin: 0; }
        .container { width: 100%; max-width: 450px; background: var(--card); padding: 30px; border-radius: 16px; border: 1px solid #334155; }
        .btn { width: 100%; background: var(--base); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #38bdf8; border: 1px solid #475569; padding: 12px; border-radius: 8px; font-family: monospace; box-sizing: border-box; }
        .log { font-size: 12px; color: #94a3b8; background: #000; padding: 10px; border-radius: 8px; height: 80px; overflow-y: auto; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center">Base Multi-Sender</h2>
    <button id="connectBtn" class="btn">Connect MetaMask</button>

    <div id="mainApp" style="display:none">
        <label style="font-size: 12px; color: #94a3b8;">Format: address, amount (one per line)</label>
        <textarea id="inputList" placeholder="0x123..., 0.01&#10;0x456..., 0.02"></textarea>
        <button id="sendBtn" class="btn" style="margin-top:15px">Confirm & Send All</button>
        <div id="statusLog" class="log">Ready to send...</div>
    </div>
</div>

<script>
    let provider, signer, myAddr;

    // Wait for the window to load to ensure 'ethers' library is present
    window.onload = function() {
        if (typeof ethers === 'undefined') {
            alert("Ethers.js library not loaded! Please check your internet connection.");
            return;
        }
        console.log("Ethers.js loaded successfully.");
    };

    async function connect() {
        if (!window.ethereum) return alert("Install MetaMask!");
        
        try {
            // Request accounts
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            myAddr = accounts[0];

            // Set up Provider and Signer
            provider = new ethers.providers.Web3Provider(window.ethereum);
            signer = provider.getSigner();

            document.getElementById('connectBtn').innerText = "Connected: " + myAddr.substring(0,6) + "...";
            document.getElementById('mainApp').style.display = 'block';
        } catch (e) {
            console.error(e);
        }
    }

    async function startSending() {
        const list = document.getElementById('inputList').value.split('\n');
        const log = document.getElementById('statusLog');
        
        // Manual Nonce Management for consecutive transactions
        let currentNonce = await provider.getTransactionCount(myAddr, "latest");

        for (let entry of list) {
            const [to, amt] = entry.split(',');
            if (!to || !amt) continue;

            try {
                log.innerHTML = `Confirming ${amt} to ${to.substring(0,8)}...`;
                
                const tx = await signer.sendTransaction({
                    to: to.trim(),
                    value: ethers.utils.parseEther(amt.trim()),
                    nonce: currentNonce
                });

                log.innerHTML = `Sent! Hash: ${tx.hash.substring(0,10)}...`;
                currentNonce++; // Increment nonce for the next confirm popup
            } catch (err) {
                log.innerHTML = `<span style="color:red">Error: ${err.message.substring(0,40)}</span>`;
                break;
            }
        }
    }

    document.getElementById('connectBtn').addEventListener('click', connect);
    document.getElementById('sendBtn').addEventListener('click', startSending);
</script>

</body>
</html>
