<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Multi-Sender Fix</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    
    <style>
        :root { --blue: #0052FF; --bg: #0f172a; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { width: 100%; max-width: 400px; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
        .btn { width: 100%; background: var(--blue); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #38bdf8; border: 1px solid #475569; padding: 12px; border-radius: 8px; font-family: monospace; box-sizing: border-box; margin: 15px 0; resize: none; }
        #log { font-size: 12px; color: #94a3b8; background: #000; padding: 10px; border-radius: 6px; margin-top: 10px; height: 60px; overflow-y: auto; border: 1px solid #334155; }
        .error-banner { display: none; background: #ef4444; color: white; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <div id="libError" class="error-banner">⚠️ Ethers.js library failed to load!</div>
    <h2 style="text-align:center; margin-top:0;">Base Multi-Send</h2>
    
    <button id="connectBtn" class="btn">Connect Wallet</button>

    <div id="app" style="display:none">
        <textarea id="list" placeholder="address, amount&#10;0x123..., 0.01&#10;0x456..., 0.05"></textarea>
        <button id="sendBtn" class="btn">Send Transactions</button>
        <div id="log">Ready...</div>
    </div>
</div>

<script>
    let provider, signer, address;

    // --- SAFETY CHECK: WAIT FOR LIB ---
    function checkLibrary() {
        if (typeof ethers === 'undefined') {
            document.getElementById('libError').style.display = 'block';
            console.error("Library Error: Ethers.js not found.");
            return false;
        }
        return true;
    }

    async function connect() {
        if (!checkLibrary()) return;
        if (!window.ethereum) return alert("Install MetaMask!");

        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            address = accounts[0];
            
            provider = new ethers.providers.Web3Provider(window.ethereum);
            signer = provider.getSigner();

            document.getElementById('connectBtn').innerText = "Connected";
            document.getElementById('app').style.display = 'block';
        } catch (e) {
            alert("Connection failed: " + e.message);
        }
    }

    async function startBatch() {
        const log = document.getElementById('log');
        const input = document.getElementById('list').value.trim();
        const lines = input.split('\n');

        let currentNonce = await provider.getTransactionCount(address, "latest");

        for (let line of lines) {
            const [to, amt] = line.split(',');
            if (!to || !amt) continue;

            try {
                log.innerText = `Sending to ${to.substring(0,8)}...`;
                const tx = await signer.sendTransaction({
                    to: to.trim(),
                    value: ethers.utils.parseEther(amt.trim()),
                    nonce: currentNonce
                });
                log.innerHTML += `<br>✅ Sent: ${tx.hash.substring(0,10)}...`;
                currentNonce++;
            } catch (err) {
                log.innerHTML += `<br>❌ Failed: ${err.message.substring(0,30)}`;
                break;
            }
        }
    }

    document.getElementById('connectBtn').onclick = connect;
    document.getElementById('sendBtn').onclick = startBatch;
</script>

<script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

</body>
</html>
