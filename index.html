<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Farcaster Sender</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #855DCD; /* Farcaster Purple */
            --danger: #ef4444;
            --text: #f8fafc;
            --border: #334155;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- TOP BAR --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #15101a;
            border-bottom: 1px solid var(--border);
        }
        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
        }
        .user-badge img {
            width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent);
        }
        .disconnect-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .disconnect-btn:hover { background: rgba(255, 255, 255, 0.2); }

        /* --- MAIN CONTENT --- */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            background: var(--card);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        h2 { margin-top: 0; color: var(--accent); text-align: center; }

        textarea {
            width: 100%;
            height: 140px;
            background: #0f172a;
            border: 1px solid var(--border);
            color: #38bdf8;
            border-radius: 12px;
            padding: 12px;
            box-sizing: border-box;
            font-family: monospace;
            resize: none;
            font-size: 13px;
            outline: none;
            margin-top: 10px;
        }
        textarea:focus { border-color: var(--accent); }

        .btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: wait; }

        .log-box {
            margin-top: 15px;
            font-size: 12px;
            color: #94a3b8;
            background: #00000044;
            padding: 10px;
            border-radius: 8px;
            height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="header" id="topBar" style="visibility: hidden;">
        <div class="user-badge" id="userBadge">
            <img id="pfp" src="" alt="">
            <span id="username">@...</span>
        </div>
        <button id="disconnectBtn" class="disconnect-btn">Disconnect</button>
    </div>

    <div class="container">
        <div id="app-view" class="card" style="display:none;">
            <h2>Multi-Send</h2>
            <p style="font-size:12px; color:#aaa; margin-bottom:5px;">
                Enter: <code>@username, amount</code> OR <code>0xAddress, amount</code>
            </p>
            <textarea id="csvInput" placeholder="@dwr, 0.001&#10;0x123..., 0.005"></textarea>
            
            <button id="sendBtn" class="btn">Send Batch</button>
            <div id="log" class="log-box">Ready...</div>
        </div>

        <div id="connect-view" style="text-align: center;">
            <h2 style="margin-bottom: 20px;">Welcome</h2>
            <button id="connectBtn" class="btn">Connect Wallet</button>
            <p style="font-size: 12px; color: #666; margin-top: 10px;">Powered by Base & Farcaster</p>
        </div>
    </div>

    <script type="module">
        try {
            const { sdk } = await import('https://esm.sh/@farcaster/miniapp-sdk');
            window.sdk = sdk;
            await sdk.actions.ready({ disableNativeGestures: true });
            console.log('✅ Farcaster SDK initialized');
            
            // Dispatch event to start logic
            window.dispatchEvent(new Event('sdk-ready'));
        } catch (error) {
            console.error('❌ Farcaster SDK failed:', error);
            document.getElementById('connectBtn').innerText = 'SDK Failed - Refresh';
        }
    </script>

    <script>
        let provider;
        let farcasterSDK;
        let isConnected = false;
        let userAddress = null;

        // Helper for Logs
        const log = (msg) => {
            const el = document.getElementById('log');
            el.innerHTML = `> ${msg}<br>${el.innerHTML}`;
        };

        window.addEventListener('sdk-ready', async () => {
            // Get the SDK instance
            farcasterSDK = window.sdk;
            
            // 1. Load User Context (Top Bar)
            try {
                const context = await farcasterSDK.context;
                if (context && context.user) {
                    document.getElementById('topBar').style.visibility = 'visible';
                    document.getElementById('username').innerText = `@${context.user.username}`;
                    document.getElementById('pfp').src = context.user.pfpUrl;
                    log(`Logged in as @${context.user.username}`);
                }
            } catch(e) { 
                console.error('Failed to load user context:', e);
                log('Failed to load user context');
            }

            // 2. Get the provider from SDK
            try {
                // Get the wallet provider from SDK
                provider = farcasterSDK.wallet.getEthereumProvider();
                
                if (!provider) {
                    log('No wallet provider available');
                    return;
                }
                
                // Check if already connected
                try {
                    const accounts = await provider.request({ method: 'eth_accounts' });
                    if (accounts && accounts.length > 0) {
                        userAddress = accounts[0];
                        isConnected = true;
                        showApp();
                        log(`Connected to wallet: ${userAddress.substring(0, 6)}...`);
                    } else {
                        log('Wallet not connected');
                    }
                } catch (e) {
                    log('Wallet connection check failed');
                }
            } catch (e) { 
                console.log("Provider error:", e.message);
                log('Wallet provider error');
            }
        });

        // --- ACTIONS ---

        function showApp() {
            document.getElementById('connect-view').style.display = 'none';
            document.getElementById('app-view').style.display = 'block';
            log('Ready to send transactions!');
        }

        function disconnectApp() {
            // Reset UI state
            document.getElementById('connect-view').style.display = 'block';
            document.getElementById('app-view').style.display = 'none';
            document.getElementById('csvInput').value = "";
            document.getElementById('log').innerHTML = "Disconnected.";
            isConnected = false;
            userAddress = null;
        }

        document.getElementById('connectBtn').onclick = async () => {
            try {
                if (!farcasterSDK) {
                    alert("Farcaster SDK not loaded. Please refresh.");
                    return;
                }

                if (!provider) {
                    alert("Wallet provider not available");
                    return;
                }

                log("Requesting wallet connection...");
                
                // Request connection using eth_requestAccounts
                const accounts = await provider.request({ 
                    method: 'eth_requestAccounts' 
                });
                
                if (accounts && accounts.length > 0) {
                    userAddress = accounts[0];
                    isConnected = true;
                    showApp();
                    log(`Connected: ${userAddress.substring(0, 6)}...`);
                } else {
                    throw new Error('No accounts returned');
                }
                
            } catch (e) { 
                console.error("Connection error:", e);
                const errorMsg = e.message || "Unknown error";
                log(`Connection failed: ${errorMsg}`);
                
                // Try alternative connection method
                if (e.message && e.message.includes('eth_requestAccounts')) {
                    log("Trying alternative connection...");
                    try {
                        // Try sending a simple request to trigger connection
                        const chainId = await provider.request({ method: 'eth_chainId' });
                        log(`Chain ID: ${chainId}`);
                        
                        // Try again with eth_accounts
                        const accounts = await provider.request({ method: 'eth_accounts' });
                        if (accounts && accounts.length > 0) {
                            userAddress = accounts[0];
                            isConnected = true;
                            showApp();
                            log(`Connected via fallback: ${userAddress.substring(0, 6)}...`);
                        }
                    } catch (fallbackError) {
                        alert("Please check your wallet and try again");
                    }
                }
            }
        };

        document.getElementById('disconnectBtn').onclick = disconnectApp;

        // --- RESOLUTION & SENDING LOGIC ---

        async function resolveFarcasterName(input) {
            // If it's already an address, return it
            if (input.startsWith('0x')) return input;

            // If it starts with @, try to resolve
            if (input.startsWith('@')) {
                const username = input.substring(1).trim(); // remove @
                log(`Resolving @${username}...`);
                
                try {
                    // Using Searchcaster API (Public) to find address
                    const res = await fetch(`https://searchcaster.xyz/api/profiles?username=${username}`);
                    const data = await res.json();
                    
                    if (data && data.length > 0) {
                        // Prefer verified address, fallback to custody address
                        const addr = data[0].connectedAddress || data[0].custodyAddress;
                        if (!addr) {
                            throw new Error(`No address found for @${username}`);
                        }
                        log(`Found @${username}: ${addr.substring(0,6)}...`);
                        return addr;
                    } else {
                        throw new Error(`User @${username} not found`);
                    }
                } catch (err) {
                    throw new Error(`Could not resolve @${username}: ${err.message}`);
                }
            }
            // If it's not an address and doesn't start with @, try to add 0x prefix
            return input.startsWith('0x') ? input : '0x' + input;
        }

        async function sendIndividualTransactions(calls) {
            log(`Sending ${calls.length} individual transactions...`);
            
            for (let i = 0; i < calls.length; i++) {
                const call = calls[i];
                const amount = ethers.utils.formatEther(call.value);
                
                log(`Sending ${i+1}/${calls.length}: ${amount} ETH to ${call.to.substring(0, 8)}...`);
                
                try {
                    const txHash = await provider.request({
                        method: 'eth_sendTransaction',
                        params: [{
                            from: userAddress,
                            to: call.to,
                            value: call.value,
                            data: "0x"
                        }]
                    });
                    
                    log(`✅ TX ${i+1} sent: ${txHash.substring(0,10)}...`);
                    
                } catch (txError) {
                    throw new Error(`Failed on transaction ${i+1}: ${txError.message}`);
                }
            }
            
            return true;
        }

        document.getElementById('sendBtn').onclick = async () => {
            const btn = document.getElementById('sendBtn');
            const rawText = document.getElementById('csvInput').value;
            const lines = rawText.split('\n');
            const calls = [];

            // Validate connection
            if (!isConnected || !provider || !userAddress) {
                alert("Please connect your wallet first");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Resolving names...";

            try {
                // Process each line
                for (let line of lines) {
                    line = line.trim();
                    if (!line) continue;
                    
                    const parts = line.split(',');
                    if (parts.length !== 2) {
                        throw new Error(`Invalid format: "${line}". Use: "@username, 0.001" or "0x..., 0.001"`);
                    }

                    let [target, amount] = parts;
                    target = target.trim();
                    amount = amount.trim();

                    // Validate amount
                    if (!amount || isNaN(parseFloat(amount)) || parseFloat(amount) <= 0) {
                        throw new Error(`Invalid amount: "${amount}" for ${target}`);
                    }

                    // 1. Resolve Name if needed
                    const finalAddress = await resolveFarcasterName(target);

                    // 2. Validate Address
                    if (!ethers.utils.isAddress(finalAddress)) {
                        throw new Error(`Invalid address: ${target} (resolved to: ${finalAddress})`);
                    }

                    // 3. Prepare transaction
                    calls.push({
                        to: finalAddress,
                        value: ethers.utils.parseEther(amount).toHexString(),
                        data: "0x"
                    });
                }

                if (calls.length === 0) throw new Error("No valid lines found");

                log(`Preparing ${calls.length} transactions...`);
                btn.innerText = "Confirm in Wallet...";

                // Try batch first, then fallback to individual
                try {
                    // Try batch send (EIP-5792)
                    const txHash = await provider.request({
                        method: 'wallet_sendCalls',
                        params: [{
                            version: '1.0',
                            chainId: '0x2105', // Base Mainnet (8453)
                            from: userAddress,
                            calls: calls
                        }]
                    });

                    log(`<span style="color:#4ade80">✅ Batch Sent! Hash: ${txHash.substring(0,10)}...</span>`);
                    log(`Check wallet for confirmation`);
                    btn.innerText = "Success!";
                    
                } catch (batchError) {
                    console.log("Batch not supported, using individual:", batchError);
                    
                    // Fallback to individual transactions
                    await sendIndividualTransactions(calls);
                    
                    log(`<span style="color:#4ade80">✅ All ${calls.length} transactions sent!</span>`);
                    btn.innerText = "Success!";
                }

                // Clear input on success
                document.getElementById('csvInput').value = "";

            } catch (err) {
                console.error('Send error:', err);
                log(`<span style="color:#ef4444">❌ Error: ${err.message}</span>`);
                btn.innerText = "Retry";
                alert(`Error: ${err.message}`);
            }
            
            setTimeout(() => { 
                btn.disabled = false; 
                if(btn.innerText.includes("Success")) btn.innerText = "Send Batch"; 
            }, 3000);
        };
    </script>
</body>
</html>
